<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="拾用个人工具箱：JSON 格式化、文本对比、备忘录和常用编码工具。">
    <meta name="theme-color" content="#24725b">
    <title>拾用 · 个人工具箱</title>
    <link rel="stylesheet" href="./styles.css">
    <script type="module" src="./app.js"></script>
</head>
<body>
    <a class="skip" href="#main">跳至主要内容</a>
    <div class="shell">
        <header class="topbar">
            <a class="brand" href="#" aria-label="拾用工具箱首页"><span class="brand-mark" aria-hidden="true">✳</span>拾用</a>
            <span id="crumb">个人工具箱</span>
        </header>
        <main id="main" tabindex="-1">
            <section id="home" aria-label="工具列表">
                <div class="home-heading">
                    <h1 id="section-title">全部工具 <span id="tool-count"></span></h1>
                    <div class="search-wrap">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                        <input id="search" type="search" placeholder="搜索工具" aria-label="搜索工具">
                        <kbd aria-hidden="true">/</kbd>
                    </div>
                </div>
                <div id="tool-grid" class="tool-grid"></div>
                <div id="empty" class="empty" hidden><h2>没有找到匹配的工具</h2><button id="reset-search">清除搜索</button></div>
            </section>
            <section id="workspace" hidden></section>
        </main>
        <footer>内容在浏览器本地处理，不上传输入数据。</footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
