server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Static tools and local notes work independently of Java availability.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location = /xxl-job-admin {
        return 302 /xxl-job-admin/;
    }

    # Resolve the private scheduler at request time so tool startup remains independent.
    location /xxl-job-admin/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $scheduler_upstream http://xxl-job-admin:8080;
        proxy_pass $scheduler_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /api {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location /api/ {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location = /actuator/health {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location /actuator/health/ {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
}
