server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    # Static tools and local notes work independently of Java availability.
    location / {
        try_files $uri $uri/ =404;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-cache" always;
    }

    location = /api {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location /api/ {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location = /actuator/health {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
    location /actuator/health/ {
        include /etc/nginx/proxy_params_shiyong.conf;
    }
}
